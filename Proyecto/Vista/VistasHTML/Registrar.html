<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="../EstilosCSS/Formularios.CSS">
</head>
<body>
    <article>
    <h1>Formulario de registro Usuarios</h1>
    <form action="../../Controladores/Registrar.php" method="post">
        <label for="Nombre">Nombre:</label>
        <input type="text" id="Nombre" name="Nombre" required><br><br>
        <label for="Contraseña">Contraseña:</label>
        <input type="password" id="Contraseña" name="Contraseña" required><br><br>
        <label for="Correo">Correo:</label>
        <input type="email" id="Correo" name="Correo" required><br><br>
        <label for="Telefono">Telefono:</label>
        <input type="tel" id="Telefono" name="Telefono" required><br><br>
        <label for="Direccion">Direccion:</label>
        <input type="text" id="Direccion" name="Direccion" required><br><br>
        <label for="FechaNacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="FechaNacimiento" name="FechaNacimiento" required><br><br>
        <label for="Edad">Edad:</label>
        <input type="number" id="Edad" name="Edad" required><br><br>
        <label for="Rol">¿Que rol es?</label>
        <select name="Rol" id="Rol">
            <option value="Estudiante">Estudiante</option>
            <option value="Profesor">Profesor</option>
        </select><br><br>
        <input id="boton" type="submit" value="Enviar"><br><br>
    </form>
    Ya tienes cuenta? <a href="Login.html">Iniciar Sesion</a>
    </article>
</body>
</html>
